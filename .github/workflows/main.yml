
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          sdkmanager --licenses

      - name: Check project files
        shell: bash
        run: |
          echo "Checking Android project..."
          ls -la
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "::error::Missing settings.gradle or settings.gradle.kts"
            exit 1
          fi
          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "::error::Missing app/build.gradle or app/build.gradle.kts"
            exit 1
          fi
          if [ ! -d app/src/main ]; then
            echo "::error::Missing app/src/main source folder"
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "::error::APK was not created"
            find app/build/outputs -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PS4PayloadSender-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
